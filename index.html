<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .search-box {
            background: white;
            padding: 20px;
            rounded: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: #667eea;
        }

        .search-box button {
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-box button:hover {
            background: #5568d3;
        }

        .search-box button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .weather-card {
            background: white;
            rounded: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 30px;
            display: none;
        }

        .weather-card.active {
            display: block;
        }

        .city-name {
            font-size: 2rem;
            color: #333;
            margin-bottom: 10px;
        }

        .date {
            color: #666;
            margin-bottom: 30px;
        }

        .temperature {
            font-size: 4rem;
            color: #667eea;
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .detail-item {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            rounded: 8px;
            text-align: center;
        }

        .detail-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 24px;
            color: #333;
            font-weight: bold;
        }

        .error-message {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            rounded: 8px;
            margin-top: 20px;
            display: none;
            text-align: center;
        }

        .error-message.active {
            display: block;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 18px;
            margin-top: 20px;
            display: none;
        }

        .loading.active {
            display: block;
        }

        @media (max-width: 600px) {
            .weather-details {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8rem;
            }

            .temperature {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Weather Dashboard</h1>
        
        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name (e.g., Madurai, Mumbai, Delhi)"
                autocomplete="off"
            >
            <button id="searchBtn" onclick="getWeather()">Search</button>
        </div>

        <div class="loading" id="loading">
            ⏳ Fetching weather data...
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="weather-card" id="weatherCard">
            <div class="city-name" id="cityName"></div>
            <div class="date" id="date"></div>
            <div class="temperature" id="temperature"></div>
            
            <div class="weather-details">
                <div class="detail-item">
                    <div class="detail-label">🌡️ Temperature</div>
                    <div class="detail-value" id="tempValue"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">💧 Humidity</div>
                    <div class="detail-value" id="humidityValue"></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">💨 Wind Speed</div>
                    <div class="detail-value" id="windValue"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Open-Meteo API URLs (no API key required!)
        const GEOCODE_API = 'https://geocoding-api.open-meteo.com/v1/search';
        const WEATHER_API = 'https://api.open-meteo.com/v1/weather';

        // Main async function to fetch weather data
        async function getWeather() {
            const cityInput = document.getElementById('cityInput');
            const searchBtn = document.getElementById('searchBtn');
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('errorMessage');
            const weatherCard = document.getElementById('weatherCard');

            const city = cityInput.value.trim();

            // Validate input
            if (!city) {
                showError('Please enter a city name');
                return;
            }

            // Reset state
            errorMessage.classList.remove('active');
            weatherCard.classList.remove('active');
            loading.classList.add('active');
            searchBtn.disabled = true;

            try {
                // Step 1: Get coordinates for the city
                const coordinates = await geocodeCity(city);
                
                // Step 2: Fetch weather data using coordinates
                const weatherData = await fetchWeather(coordinates);
                
                // Step 3: Display the weather
                displayWeather(city, weatherData);

            } catch (error) {
                showError(error.message);
            } finally {
                loading.classList.remove('active');
                searchBtn.disabled = false;
            }
        }

        // Async function to geocode city name to coordinates
        async function geocodeCity(city) {
            const response = await fetch(`${GEOCODE_API}?name=${city}&count=1`);
            
            if (!response.ok) {
                throw new Error(`Failed to search for city: ${response.status}`);
            }

            const data = await response.json();

            if (!data.results || data.results.length === 0) {
                throw new Error(`City "${city}" not found. Please try another name.`);
            }

            return {
                latitude: data.results[0].latitude,
                longitude: data.results[0].longitude,
                name: data.results[0].name
            };
        }

        // Async function to fetch weather data
        async function fetchWeather(coordinates) {
            const url = `${WEATHER_API}?latitude=${coordinates.latitude}&longitude=${coordinates.longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&timezone=auto`;

            const response = await fetch(url);
            
            if (!response.ok) {
                throw new Error(`Failed to fetch weather data: ${response.status}`);
            }

            const data = await response.json();
            
            // Validate response data
            if (!data.current) {
                throw new Error('Weather data is unavailable for this location');
            }

            return data.current;
        }

        // Function to display weather data dynamically
        function displayWeather(city, weather) {
            const cityName = document.getElementById('cityName');
            const date = document.getElementById('date');
            const temperature = document.getElementById('temperature');
            const tempValue = document.getElementById('tempValue');
            const humidityValue = document.getElementById('humidityValue');
            const windValue = document.getElementById('windValue');
            const weatherCard = document.getElementById('weatherCard');

            // Get current date
            const now = new Date();
            const dateString = now.toLocaleDateString('en-IN', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            // Update DOM elements
            cityName.textContent = `📍 ${city}`;
            date.textContent = dateString;
            temperature.textContent = `${Math.round(weather.temperature_2m)}°C`;
            tempValue.textContent = `${Math.round(weather.temperature_2m)}°C`;
            humidityValue.textContent = `${weather.relative_humidity_2m}%`;
            windValue.textContent = `${weather.wind_speed_10m} km/h`;

            // Show weather card
            weatherCard.classList.add('active');
        }

        // Function to show error messages
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = `❌ ${message}`;
            errorMessage.classList.add('active');
        }

        // Add event listener for Enter key
        document.getElementById('cityInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                getWeather();
            }
        });

        // Load default city on page load (Madurai since you're in Madurai!)
        window.addEventListener('load', () => {
            document.getElementById('cityInput').value = 'Madurai';
            getWeather();
        });
    </script>
</body>
</html>
